name: balmatchum_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

dependencies:
  serverpod: 4.0.3
  serverpod_shared: 4.0.3
  serverpod_auth_core_server: 4.0.3
  serverpod_auth_idp_server: 4.0.3
  sign_in_with_apple_server: 1.0.0
  clock: ^1.1.1
  characters: ^1.4.1
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.1.0
  http: ^1.2.0
  pointycastle: 4.0.0

dev_dependencies:
  serverpod_auth_idp_client: 4.0.3
  balmatchum_client:
    path: ../client
  lints: '>=3.0.0 <7.0.0'
  postgres: ^3.5.16
  serverpod_database: 4.0.3
  serverpod_test: 4.0.3
  test: ^1.25.5
