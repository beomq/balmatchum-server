class: QuizAssignment
serverOnly: true
table: quiz_assignment
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  date: String
  slot: String
  questionId: String
  version: int
  policyVersion: String
  issuedAt: DateTime
  answerIndex: int?
  answeredAt: DateTime?
  awardedPoints: int, default=0
indexes:
  quiz_assignment_auth_user_slot:
    fields: authUserId, date, slot
    unique: true
  quiz_assignment_auth_user_question:
    fields: authUserId, questionId
    unique: true
  quiz_assignment_auth_user_id:
    fields: authUserId, id
