class: ExternalIdentity
serverOnly: true
table: external_identity
fields:
  provider: String
  issuer: String
  audience: String
  subjectNamespace: String
  subject: String
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Restrict)
indexes:
  external_identity_provider_subject:
    fields: provider, issuer, audience, subjectNamespace, subject
    unique: true
