class: StoredGpsRecord
serverOnly: true
table: gps_record
fields:
  id: UuidValue?, defaultPersist=random_v7
  owner: String
  authUser: module:serverpod_auth_core:AuthUser?, relation(optional, onDelete=Cascade)
  clientRecordId: UuidValue
  persistedAt: DateTime
  payload: GpsRecordInput?
  deleted: bool, default=false
  firstLocalDay: int?
  lastLocalDay: int?
indexes:
  gps_record_owner_client_unique:
    fields: owner, clientRecordId
    unique: true
  gps_record_auth_user_client:
    fields: authUserId, clientRecordId
    unique: true
  gps_record_auth_user_day:
    fields: authUserId, deleted, lastLocalDay, firstLocalDay
