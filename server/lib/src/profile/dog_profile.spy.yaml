class: DogProfile
serverOnly: true
table: dog_profile
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  breedId: String
  name: String
  sex: String
  dailyGoal: int
  firstMetAt: DateTime
  revision: int, default=1
indexes:
  dog_profile_auth_user:
    fields: authUserId
    unique: true
