class: StepRevision
serverOnly: true
table: step_revision
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  date: String
  generation: int
  revision: int
  digest: String
indexes:
  step_revision_auth_user_key:
    fields: authUserId, date, generation, revision
    unique: true
