class: PointEntry
serverOnly: true
table: point_entry
fields:
  owner: String
  entryKey: String
  kind: String
  date: String?
  amount: int
  fromUnits: int?
  throughUnits: int?
  policyVersion: String
  createdAt: DateTime
  slices: List<RewardSlice>?
indexes:
  point_entry_key:
    fields: owner, entryKey
    unique: true
