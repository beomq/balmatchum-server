class: PointEntry
serverOnly: true
table: point_entry
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  entryKey: String
  kind: String
  date: String?
  amount: int
  fromUnits: int?
  throughUnits: int?
  policyVersion: String
  createdAt: DateTime
  slices: List<RewardSlice>?
indexes:
  point_entry_auth_user_key:
    fields: authUserId, entryKey
    unique: true
  point_entry_auth_user_date:
    fields: authUserId, date
