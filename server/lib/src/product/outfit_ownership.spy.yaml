class: OutfitOwnership
serverOnly: true
table: outfit_ownership
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  outfitId: String
  ### Colour SKU; the legacy vest is 'classic'.
  colourId: String, default='classic'
  ### purchase, subscription, or migration.
  source: String, default='purchase'
  purchasedAt: DateTime
indexes:
  outfit_ownership_auth_user_key:
    fields: authUserId, outfitId, colourId
    unique: true
