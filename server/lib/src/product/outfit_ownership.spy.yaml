class: OutfitOwnership
serverOnly: true
table: outfit_ownership
fields:
  owner: String
  authUser: module:serverpod_auth_core:AuthUser?, relation(optional, onDelete=Cascade)
  outfitId: String
  purchasedAt: DateTime
indexes:
  outfit_ownership_key:
    fields: owner, outfitId
    unique: true
  outfit_ownership_auth_user_key:
    fields: authUserId, outfitId
    unique: true
