### A confirmed photo. [url] is a short-lived signed GET; cache the bytes by
### [photoId], not by URL, and list again after [urlExpiresAt].
class: PhotoView
fields:
  photoId: UuidValue
  contentType: String
  byteSize: int
  width: int?
  height: int?
  createdAt: DateTime
  url: String
  urlExpiresAt: DateTime
