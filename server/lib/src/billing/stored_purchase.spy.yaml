class: StoredPurchase
serverOnly: true
table: billing_purchase
fields:
  owner: String
  identityHash: String
  store: String
  environment: String
  productId: String
  kind: String
  purchaseReference: String
  state: String
  sequence: int
  observedAt: DateTime
  purchasedAt: DateTime?
  expiresAt: DateTime?
  graceExpiresAt: DateTime?
  revokedAt: DateTime?
  acknowledgementPending: bool
indexes:
  billing_purchase_identity:
    fields: identityHash
    unique: true
  billing_purchase_owner:
    fields: owner
