class: StoredPurchase
serverOnly: true
table: billing_purchase
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Restrict)
  identityHash: String
  store: String
  environment: String
  productId: String
  kind: String
  purchaseReference: String
  transactionId: String?
  state: String
  sequence: int
  observedAt: DateTime
  purchasedAt: DateTime?
  expiresAt: DateTime?
  graceExpiresAt: DateTime?
  revokedAt: DateTime?
  acknowledgementPending: bool
indexes:
  billing_purchase_identity:
    fields: identityHash
    unique: true
  billing_purchase_auth_user_id:
    fields: authUserId, id
  billing_purchase_auth_user_identity:
    fields: authUserId, identityHash
