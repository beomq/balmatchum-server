services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: balmatchum
      POSTGRES_PASSWORD: ${SERVERPOD_PASSWORD_database:?Set SERVERPOD_PASSWORD_database}
    volumes:
      - balmatchum_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d balmatchum"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  balmatchum_data:
